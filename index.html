<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' 'unsafe-eval' blob: app:; style-src 'self' 'unsafe-inline' app:; img-src 'self' data: blob: app:; connect-src 'self' blob: data: app: http://localhost:5173 http://127.0.0.1:5173; worker-src 'self' blob: app:; font-src 'self' data: app:; object-src 'none'; base-uri 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="3D Go game with KataGo AI, chess-piece stones and score-colored board." />
    <title>GoGame 3D</title>
    <link rel="icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="group">
          <button id="btn-settings" data-i18n="settings" data-i18n-title="settingsTitle" title="Game settings">Settings</button>
          <button id="btn-new" data-i18n="newGame" data-i18n-title="newGameTitle" title="New game">New</button>
          <button id="btn-pass" data-i18n="pass" data-i18n-title="passTitle" title="Pass">Pass</button>
          <button id="btn-undo" data-i18n="undo" data-i18n-title="undoTitle" title="Undo">Undo</button>
          <button id="btn-eval" data-i18n="eval" data-i18n-title="evalTitle" title="Evaluate position">Eval</button>
          <button id="btn-view" data-i18n-title="toggleViewTitle" title="Toggle 2D / 3D">2D</button>
          <button id="btn-save" data-i18n="save" data-i18n-title="saveTitle" title="Save SGF">Save</button>
          <button id="btn-load" data-i18n="load" data-i18n-title="loadTitle" title="Load SGF">Load</button>
          <input id="file-sgf" type="file" accept=".sgf,text/plain" hidden />
          <button id="btn-credits" data-i18n="credits" data-i18n-title="creditsTitle" title="Third-party credits">Credits</button>
        </div>
      </header>

      <nav id="replay-bar" class="replay-bar" aria-label="SGF Playback">
        <div class="replay-group replay-nav">
          <button id="btn-first" data-i18n-title="firstMove" title="First move">&#x23EE;</button>
          <button id="btn-prev" data-i18n-title="prevMove" title="Previous move">&#x25C0;</button>
          <button id="btn-play" data-i18n-title="play" title="Play / Pause">&#x25B6;</button>
          <button id="btn-next" data-i18n-title="nextMove" title="Next move">&#x25B6;&#xFE0E;</button>
          <button id="btn-last" data-i18n-title="lastMoveBtn" title="Last move">&#x23ED;</button>
        </div>
        <div class="replay-group replay-slider-group">
          <input id="replay-slider" type="range" min="0" max="0" value="0" />
          <span id="replay-counter">0 / 0</span>
        </div>
        <div class="replay-group replay-speed-group">
          <label><span data-i18n="speed">Speed</span>
            <select id="replay-speed">
              <option value="1500">0.7x</option>
              <option value="1000" selected>1.0x</option>
              <option value="500">2.0x</option>
            </select>
          </label>
        </div>
      </nav>

      <main id="stage">
        <canvas id="scene3d" touch-action="none"></canvas>
        <canvas id="scene2d" hidden></canvas>
        <aside id="rank-legend" aria-label="Piece strength">
          <div class="legend-title"><span data-i18n="legendTitle">Piece strength</span> <span data-i18n="legendSubtitle">strong → weak</span></div>
          <ul>
            <li><span class="glyph">♚</span><span class="name" data-i18n="king">King</span><span class="range">65%+</span></li>
            <li><span class="glyph">♛</span><span class="name" data-i18n="queen">Queen</span><span class="range">60–64%</span></li>
            <li><span class="glyph">♜</span><span class="name" data-i18n="rook">Rook</span><span class="range">48–59%</span></li>
            <li><span class="glyph">♝</span><span class="name" data-i18n="bishop">Bishop</span><span class="range">46–47%</span></li>
            <li><span class="glyph">♞</span><span class="name" data-i18n="knight">Knight</span><span class="range">40–45%</span></li>
            <li><span class="glyph">♟</span><span class="name" data-i18n="pawn">Pawn</span><span class="range">0–39%</span></li>
            <li class="dead"><span class="cube" id="dead-marker"></span><span class="name" data-i18n="dead">Dead</span><span class="range">&lt; 0%</span></li>
          </ul>
        </aside>
        <div id="thinking" class="overlay" hidden><span class="spinner"></span> <span data-i18n="thinking">Thinking…</span></div>
        <div id="boot" class="overlay" data-i18n="bootLoading">Loading KataGo model…</div>
      </main>

      <section id="eval-graph-panel" class="eval-graph-panel" aria-label="Evaluation Graph">
        <div class="eval-graph-header">
          <div class="eval-graph-title-group">
            <span class="eval-graph-title" data-i18n="evalGraphTitle">AI Evaluation Graph</span>
            <span id="eval-graph-info" class="eval-graph-info"></span>
          </div>
          <div class="eval-graph-controls">
            <button id="btn-graph-mode" class="graph-btn" title="Toggle Winrate / Score Lead" data-i18n="evalGraphModeLead">Score Lead pt</button>
            <button id="btn-close-graph" class="graph-btn graph-close-btn" title="Close evaluation graph" aria-label="Close">&times;</button>
          </div>
        </div>
        <div class="eval-graph-body">
          <canvas id="eval-graph-canvas"></canvas>
        </div>
      </section>

      <div id="settings-modal" class="overlay settings-modal" hidden>
        <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <div class="settings-header">
            <h2 id="settings-title" data-i18n="settings">Settings</h2>
            <button id="btn-close-settings" class="credits-close" title="Close" aria-label="Close">&times;</button>
          </div>
          <div class="settings-body">
            <label><span data-i18n="board">Board</span>
              <select id="board-size">
                <option value="9" selected>9 &times; 9</option>
                <option value="13">13 &times; 13</option>
                <option value="19">19 &times; 19</option>
              </select>
            </label>
            <label data-i18n-title="rulesTitle" title="Chinese rules: area scoring (stones + territory)."><span data-i18n="rules">Rules</span>
              <select id="rules">
                <option value="chinese" data-i18n="rulesChinese" selected>Chinese</option>
              </select>
            </label>
            <label><span data-i18n="boardColor">Board Color</span>
              <select id="board-color">
                <option value="wood" data-i18n="boardWood" selected>Wood</option>
                <option value="green" data-i18n="boardGreen">Green</option>
                <option value="gray" data-i18n="boardGray">Gray</option>
              </select>
            </label>
            <label><span data-i18n="opponent">Opponent</span>
              <select id="ai-level">
                <option value="dan" data-i18n="dan" selected>KataGo (Dan)</option>
                <option value="kyu" data-i18n="kyu">KataGo (Kyu)</option>
                <option value="manual" data-i18n="manual">Manual (2P)</option>
              </select>
            </label>
            <label><span data-i18n="playerSide">Side</span>
              <select id="player-side">
                <option value="black" data-i18n="sideBlack" selected>Black (First)</option>
                <option value="white" data-i18n="sideWhite">White (Second)</option>
              </select>
            </label>
            <label><span data-i18n="pieces">Pieces</span>
              <select id="piece-style">
                <option value="clayfoot" data-i18n="pieceClayfoot">Clayfoot Studios</option>
                <option value="dark-yagami" data-i18n="pieceDarkYagami">Dark Yagami</option>
                <option value="animal-bag" data-i18n="pieceAnimalBag">Animal Bag</option>
                <option value="kenney-pets" data-i18n="pieceKenneyPets">Kenney Cube Pets</option>
                <option value="quirky-animals" data-i18n="pieceQuirkyAnimals" selected>Quirky Animals</option>
                <option value="stones" data-i18n="pieceStones">Traditional Stones</option>
              </select>
            </label>
            <label><span data-i18n="deadStones">Dead Stones</span>
              <select id="dead-stone-style">
                <option value="cube" data-i18n="deadCube" selected>Cube</option>
                <option value="stone" data-i18n="deadStone">Go Stone</option>
              </select>
            </label>
            <label><span data-i18n="captureEffect">Capture Effect</span>
              <select id="capture-effect">
                <option value="shatter" data-i18n="captureShatter" selected>Shatter</option>
                <option value="dissolve" data-i18n="captureDissolve">Dissolve</option>
                <option value="height" data-i18n="captureHeight">Shrink Height</option>
              </select>
            </label>
            <label><span data-i18n="komi">Komi</span>
              <input id="komi" type="number" step="0.5" min="0" max="20" value="7" />
            </label>
            <label class="toggle-control" id="label-hover-eval" title="Realtime ownership preview on mouse hover">
              <input id="toggle-hover-eval" type="checkbox" checked />
              <span data-i18n="hoverEval">Hover Eval</span>
            </label>
            <label class="toggle-control" id="label-heatmap" data-i18n-title="heatmapTitle" title="Territory heatmap">
              <input id="toggle-heatmap" type="checkbox" checked />
              <span data-i18n="heatmap">Territory</span>
            </label>
            <label><span data-i18n="heatmapColors">Territory Colors</span>
              <select id="heatmap-theme">
                <option value="green-orange" data-i18n="heatGreenOrange" selected>Green / Orange</option>
                <option value="orange-green" data-i18n="heatOrangeGreen">Orange / Green</option>
                <option value="blue-orange" data-i18n="heatBlueOrange">Blue / Orange</option>
                <option value="orange-blue" data-i18n="heatOrangeBlue">Orange / Blue</option>
                <option value="gray-red" data-i18n="heatGrayRed">Gray / Red</option>
                <option value="red-gray" data-i18n="heatRedGray">Red / Gray</option>
              </select>
            </label>
            <label class="toggle-control" id="label-animations" title="Play idle animations">
              <input id="toggle-animations" type="checkbox" checked />
              <span data-i18n="animations">Animations</span>
            </label>
            <label class="toggle-control" id="label-eval-graph" title="Evaluation graph">
              <input id="toggle-eval-graph" type="checkbox" checked />
              <span data-i18n="evalGraph">Eval Graph</span>
            </label>
            <label class="toggle-control" id="label-eye-highlight" title="Highlight true eyes and two-eye groups">
              <input id="toggle-eye-highlight" type="checkbox" checked />
              <span data-i18n="twoEyes">Two Eyes</span>
            </label>
            <label id="label-wall-model" title="Model placed between paired true eyes">
              <span data-i18n="wallModel">Wall</span>
              <select id="wall-model">
                <option value="off" data-i18n="off">Off</option>
                <option value="seaweed" data-i18n="wallSeaweed">Seaweed</option>
                <option value="fence" data-i18n="wallFence" selected>Fence</option>
              </select>
            </label>
            <label id="label-fence-model" title="Fence model">
              <span data-i18n="fenceModel">Fence Model</span>
              <select id="fence-model">
                <option value="dark" data-i18n="fenceDark" selected>Fence (Dark)</option>
                <option value="light" data-i18n="fenceLight">Fence (Light)</option>
              </select>
            </label>
            <label id="label-true-eye-model" title="Model placed on each true eye">
              <span data-i18n="trueEyeModel">True Eye</span>
              <select id="true-eye-model">
                <option value="off" data-i18n="off">Off</option>
                <option value="cute" data-i18n="trueEyeCute">Cute Flower</option>
                <option value="trueeye" data-i18n="trueEyeTrue" selected>True Eye Flower</option>
              </select>
            </label>
            <label class="toggle-control" id="label-false-eye-models" title="Weed model on each living false eye">
              <input id="toggle-false-eye-models" type="checkbox" checked />
              <span data-i18n="falseEyeModel">False Eye</span>
            </label>
            <label><span data-i18n="language">Language</span>
              <select id="language-select">
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="es">Español</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div id="credits-modal" class="overlay credits-modal" hidden>
        <div class="credits-panel" role="dialog" aria-modal="true" aria-labelledby="credits-title">
          <div class="credits-header">
            <h2 id="credits-title" data-i18n="credits">Credits</h2>
            <button id="btn-close-credits" class="credits-close" title="Close" aria-label="Close">&times;</button>
          </div>
          <pre id="credits-content"></pre>
        </div>
      </div>

      <footer id="status">
        <span id="turn">Black to play</span>
        <span id="score"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
